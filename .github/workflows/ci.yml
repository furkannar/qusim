name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated badge.json
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: pip install -e .[dev]

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: pytest --junitxml=pytest-results.xml -q

      - name: Generate badge data
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        run: |
          python - <<'EOF'
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(suite.get("tests", 0))
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed = tests - failures - skipped

          badge = {
              "schemaVersion": 1,
              "label": "tests",
              "message": f"{passed} passed" if failures == 0 else f"{failures} failed",
              "color": "brightgreen" if failures == 0 else "red",
          }
          with open("badge.json", "w") as f:
              json.dump(badge, f)
          print(json.dumps(badge))
          EOF

      - name: Commit badge update
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.json
          git diff --cached --quiet || (git commit -m "chore: update test badge [skip ci]" && git push)

      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
