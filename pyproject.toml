[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qusim-np"
version = "1.3"
description = "A lightweight quantum simulation package in pure NumPy: a QuantumCircuit API, matrix-free state-vector algorithms, VQE, noise models with quantum trajectories, and shot-noise estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Furkan Nar", email = "furkan_nar4185@outlook.com"},
]
keywords = ["quantum", "quantum-computing", "quantum-circuit", "simulation", "state-vector", "vqe", "grover", "deutsch-jozsa", "qft", "noise-models", "quantum-trajectories", "shot-noise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/furkannar/qusim-np"
Repository = "https://github.com/furkannar/qusim-np"

[tool.setuptools.packages.find]
include = ["qusim_np*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
