[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qusim"
version = "1.0"
description = "A minimal, readable quantum computing simulator: gates, state-vector algorithms, and VQE"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Furkan Nar", email = "furkan_nar4185@outlook.com"},
]
keywords = ["quantum", "quantum-computing", "simulation", "vqe", "grover", "qft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/furkannar/qusim"
Repository = "https://github.com/furkannar/qusim"

[tool.setuptools.packages.find]
include = ["qusim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
